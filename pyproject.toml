[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-price-agent"
version = "1.0.0"
description = "HengSeng & KRX Sentiment-Driven Price Prediction Agent with Zero-Leakage Validation"
authors = [{ name = "Shaik Afrid" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "yfinance>=0.2.40",
    "apify-client>=1.7.0",
    "requests>=2.31.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "plotly>=5.22.0",
    "kaleido>=0.2.1",
    "reportlab>=4.2.0",
    "pytest>=8.1.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
